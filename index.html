<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambria</title>
    <meta name="description" content="Wedding & Event Décor Management" />
    <!--
      Fonts belong to the DOCUMENT, not to a component.
      This link used to live inside StudioApp's render. React reconciles whatever is in the tree, so
      every re-render put the stylesheet back in play — and with display=swap the browser drops to
      the fallback face for a frame while it re-applies. Only the serif headings showed it, and only
      on tab switch, because that is what re-renders StudioApp (the focus and visibility listeners).
      Loaded here it is fetched once by the document and never reconciled again.
      preconnect first: the CSS and the font files come from two different hosts, and opening both
      connections up front saves a round trip on the first paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600;1,700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
