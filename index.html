<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambria</title>
    <meta name="description" content="Wedding & Event Décor Management" />
    <!--
      FAVICON. The app had none at all, so tabs showed the browser's blank page icon — and with
      Studio and IMS routinely open side by side, neither tab was identifiable at a glance.
      Files live in public/ and are referenced from the site root: Vite rewrites a leading "/" here
      with the configured base ("/ambria-prod/"), so this resolves correctly on GitHub Pages without
      the path being hardcoded.
      Two files on purpose, and two SIZES. The source artwork was 1254px / 1.76MB — 23x the whole CSS
      bundle, fetched by every visitor to draw a 16px tab icon. 48px covers the tab (browsers downscale
      to 16/32); 180px is what iOS uses when
      someone adds the app to a home screen, and without it iOS screenshots the page instead.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      INSTALLABLE APP (PWA). manifest.webmanifest + public/sw.js (registered in src/main.jsx) let
      Android/Chrome offer "Install app"; the apple-* tags make "Add to Home Screen" on iPhone open
      full-screen with its own icon and name instead of inside Safari. Status bar "default" (not
      black-translucent) so the app header never slides under the notch.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#210C49" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ambria" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Fonts belong to the DOCUMENT, not to a component.
      This link used to live inside StudioApp's render. React reconciles whatever is in the tree, so
      every re-render put the stylesheet back in play — and with display=swap the browser drops to
      the fallback face for a frame while it re-applies. Only the serif headings showed it, and only
      on tab switch, because that is what re-renders StudioApp (the focus and visibility listeners).
      Loaded here it is fetched once by the document and never reconciled again.
      preconnect first: the CSS and the font files come from two different hosts, and opening both
      connections up front saves a round trip on the first paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Image hosts: Browse's video thumbnails (i.ytimg.com) and every inventory/library photo
      (Supabase Storage). Opening these connections at page load means the first thumbnail on a
      grid isn't also paying for DNS + TLS. Supabase gets both forms: images load without CORS,
      the app's own API/function calls with it, and each needs its own connection.
    -->
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!--
      Inter joins the list for the IMS design system (body, labels, buttons). Four weights only —
      the sheet asks for Regular / Medium / SemiBold / Bold and nothing else, and each extra weight
      is a separate font file every visitor pays for. Playfair Display was already here for
      Studio's headings, so IMS adopting it for titles costs no additional request.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600;1,700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
